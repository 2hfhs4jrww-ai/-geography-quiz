function sizeCanvas(){const r=$('padPanel').getBoundingClientRect();const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.floor(r.width*devicePixelRatio);canvas.height=Math.floor(r.height*devicePixelRatio);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineJoin='round';if(old.width)ctx.drawImage(old,0,0,old.width/devicePixelRatio,old.height/devicePixelRatio)}
function pos(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle='#172033';ctx.lineWidth=erase?24:(e.pointerType==='pen'&&e.pressure?2+e.pressure*3:3);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;e.preventDefault()});
canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
$('pen').onclick=()=>{wrap.style.display='block';setTimeout(sizeCanvas,20)};$('close').onclick=()=>wrap.style.display='none';$('black').onclick=()=>erase=false;$('eraser').onclick=()=>erase=true;$('clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
window.addEventListener('resize',()=>{if(wrap.style.display==='block')sizeCanvas()});render();
</script></body></html>
